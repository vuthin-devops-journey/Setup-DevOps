replicaCount: 2

image:
  repository: ghcr.io/vuthin-devops-journey/setup-devops
  tag: c85d5c82197e709b4d6e134fca13ffe32aca12e5
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 5000

database:
  host: postgres
  port: "5432"
  secretName: db-secret

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
