replicaCount: 2

image:
  repository: ghcr.io/vuthin-devops-journey/setup-devops
  tag: b7ee3d2f390042ccd778ff5635aad94b3a505273
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 5000

database:
  host: postgres
  port: "5432"
