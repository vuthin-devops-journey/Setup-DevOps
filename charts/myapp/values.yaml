replicaCount: 4

image:
  repository: ghcr.io/vuthin-devops-journey/setup-devops
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 5000

database:
  host: postgres
  port: "5432"
  secretName: db-secret

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "500m"

probes:
  path: /health
